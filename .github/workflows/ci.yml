name: CI

on:
  push:
    branches: [main, rebuild, 'feat/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: profit
          POSTGRES_PASSWORD: profit
          POSTGRES_DB: profit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profit"
          --health-interval 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Test isolated workout preview fixtures
        run: node --import ./node_modules/tsx/dist/loader.mjs --test ../scripts/workout-*.test.*
      - name: Check browser harness formatting
        run: npx --no-install prettier --check '../scripts/workout-*.{ts,mjs}'

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  workout-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            mobile/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix mobile
      - name: Export real app for isolated fixture API
        working-directory: mobile
        run: npx --no-install expo export --platform web --output-dir ../workout-browser-web
        env:
          EXPO_PUBLIC_API_URL: /api
      - name: Check workout in existing Chrome
        run: |
          node --import ./backend/node_modules/tsx/dist/loader.mjs scripts/workout-preview.ts workout-browser-web > /tmp/workout-preview.log 2>&1 &
          PREVIEW_PID=$!
          chromedriver --port=9515 > /tmp/workout-chromedriver.log 2>&1 &
          DRIVER_PID=$!
          trap 'kill "$PREVIEW_PID" "$DRIVER_PID" 2>/dev/null || true' EXIT
          node scripts/workout-browser.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workout-browser-evidence
          path: |
            workout-browser-artifacts/
            /tmp/workout-preview.log
            /tmp/workout-chromedriver.log
