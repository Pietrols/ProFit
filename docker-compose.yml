services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: profit
      POSTGRES_PASSWORD: profit
      POSTGRES_DB: profit
    ports:
      - "5432:5432"
    volumes:
      - profit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profit"]
      interval: 5s
      retries: 10

volumes:
  profit-db:
